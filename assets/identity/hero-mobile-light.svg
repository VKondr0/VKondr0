
<svg xmlns="http://www.w3.org/2000/svg"
     width="640"
     height="760"
     viewBox="0 0 640 760"
     role="img"
     aria-labelledby="title desc">

  <title id="title">VK / INDEX — Vitalii Kondratiuk</title>

  <desc id="desc">
    Light mobile profile banner for Vitalii Kondratiuk.
    Computer Engineering, Information Systems, Finance.
  </desc>

  <defs>
    <linearGradient id="background"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%" stop-color="#F0EEE7"/>
      <stop offset="100%" stop-color="#E7EAE0"/>
    </linearGradient>

    <linearGradient id="logo-dark"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%" stop-color="#101413"/>
      <stop offset="100%" stop-color="#1C2420"/>
    </linearGradient>

    <linearGradient id="lime"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%" stop-color="#9FD354"/>
      <stop offset="100%" stop-color="#8FC34A"/>
    </linearGradient>

    <linearGradient id="wave"
                    x1="0" y1="0"
                    x2="1" y2="0">
      <stop offset="0%" stop-color="#879D78"/>
      <stop offset="55%" stop-color="#8FC34A"/>
      <stop offset="100%" stop-color="#6F9465"/>
    </linearGradient>

    <clipPath id="frame">
      <rect width="640" height="760" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">

    <!-- Background -->

    <rect width="640"
          height="760"
          fill="url(#background)"/>

    <!-- Header -->

    <text x="34" y="50"
          font-family="monospace"
          font-size="22"
          font-weight="bold"
          letter-spacing="4"
          fill="#547C30">
      VK / INDEX
    </text>

    <text x="606" y="50"
          text-anchor="end"
          font-family="monospace"
          font-size="15"
          letter-spacing="2"
          fill="#607265">
      PERSONAL ARCHIVE
    </text>

    <line x1="34" y1="72"
          x2="606" y2="72"
          stroke="#A7B5A4"
          stroke-width="1"/>

    <!-- Construction geometry -->

    <g fill="none" stroke="#728673">

      <circle cx="310" cy="242" r="169"
              stroke-width="1.4"
              opacity="0.65"/>

      <circle cx="310" cy="242" r="125"
              stroke-width="0.8"
              opacity="0.30"/>

      <path d="M310 84 V411
               M93 242 H527
               M111 413 L505 76"
            stroke-width="1"
            opacity="0.45"/>

      <path d="M151 127 H465
               M159 350 H462"
            stroke-width="0.7"
            opacity="0.25"/>

    </g>

    <!-- Registration marks -->

    <g fill="none"
       stroke="#657968"
       stroke-width="1.2"
       opacity="0.80">

      <path d="M98 150 H118 M108 140 V160"/>
      <path d="M497 143 H517 M507 133 V153"/>

    </g>

    <!-- VK monogram -->

    <g transform="translate(-15 -92) scale(0.52)">

      <!-- V -->

      <path
        d="M247 421
           H379
           L501 628
           L619 421
           H753
           L506 838
           Z"
        fill="url(#logo-dark)"
      />

      <!-- K upper geometry -->

      <path
        d="M855 421
           H999
           L802 642
           H701
           V742
           L636 671
           Z"
        fill="url(#logo-dark)"
      />

      <!-- K lime accent -->

      <path
        d="M802 644
           L971 838
           H788
           L708 749
           Z"
        fill="url(#lime)"
      />

    </g>

    <!-- Identity separator -->

    <line x1="77" y1="423"
          x2="563" y2="423"
          stroke="#96A394"
          stroke-width="1"/>

    <!-- Name -->

    <text x="320" y="493"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="69"
          font-weight="900"
          letter-spacing="-2"
          fill="#101413">
      VITALII
    </text>

    <text x="320" y="554"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="61"
          font-weight="900"
          letter-spacing="-2"
          fill="#101413">
      KONDRATIUK
    </text>

    <!-- Accent -->

    <rect x="314" y="573"
          width="12" height="12"
          fill="#8FC34A"/>

    <!-- Academic fields -->

    <g text-anchor="middle"
       font-family="monospace"
       font-size="22"
       letter-spacing="2"
       fill="#547C30">

      <text x="320" y="620">
        COMPUTER ENGINEERING
      </text>

      <text x="320" y="652">
        INFORMATION SYSTEMS
      </text>

      <text x="320" y="684">
        FINANCE
      </text>

    </g>

    <!-- Contour waves -->

    <g fill="none"
       stroke="url(#wave)"
       stroke-width="1.1"
       opacity="0.80">

      <path d="M0 711 C100 681 182 745 280 711 S475 682 640 705"/>

      <path d="M0 720 C100 690 182 754 280 720 S475 691 640 714"/>

      <path d="M0 729 C100 699 182 763 280 729 S475 700 640 723"/>

      <path d="M0 738 C100 708 182 772 280 738 S475 709 640 732"/>

      <path d="M0 747 C100 717 182 781 280 747 S475 718 640 741"/>

      <path d="M0 756 C100 726 182 790 280 756 S475 727 640 750"/>

      <path d="M0 765 C100 735 182 799 280 765 S475 736 640 759"/>

    </g>

  </g>
</svg>