<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="270"
     viewBox="0 0 1200 270"
     role="img"
     aria-labelledby="title desc">

  <title id="title">
    The Human Exchange — VK / INDEX
  </title>

  <desc id="desc">
    Light theme project card for The Human Exchange.
    A fictional marketplace for time, sleep,
    energy and other everyday resources.
  </desc>

  <defs>
    <linearGradient id="background"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%" stop-color="#F0EEE7"/>
      <stop offset="100%" stop-color="#E7EAE0"/>
    </linearGradient>

    <linearGradient id="accent"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%" stop-color="#879D78"/>
      <stop offset="100%" stop-color="#547C30"/>
    </linearGradient>

    <clipPath id="frame">
      <rect width="1200" height="270" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">

    <!-- Background -->

    <rect width="1200"
          height="270"
          fill="url(#background)"/>

    <rect x="1" y="1"
          width="1198" height="268"
          rx="17"
          fill="none"
          stroke="#BBC7B7"/>

    <!-- Header -->

    <rect x="45" y="35"
          width="9" height="9"
          fill="#8FC34A"/>

    <text x="70" y="44"
          font-family="monospace"
          font-size="15"
          letter-spacing="3"
          fill="#547C30">
      01 / SELECTED WORK
    </text>

    <text x="1149" y="44"
          text-anchor="end"
          font-family="monospace"
          font-size="12"
          letter-spacing="2"
          fill="#607265">
      PROJECT 002
    </text>

    <line x1="45" y1="67"
          x2="1155" y2="67"
          stroke="#A7B5A4"/>

    <!-- Project identity -->

    <text x="48" y="137"
          font-family="Arial, Helvetica, sans-serif"
          font-size="54"
          font-weight="800"
          letter-spacing="-1.5"
          fill="#101413">
      THE HUMAN
    </text>

    <text x="48" y="191"
          font-family="Arial, Helvetica, sans-serif"
          font-size="54"
          font-weight="800"
          letter-spacing="-1.5"
          fill="#101413">
      EXCHANGE
    </text>

    <!-- Technologies -->

    <rect x="48" y="216"
          width="35" height="3"
          fill="#8FC34A"/>

    <text x="99" y="225"
          font-family="monospace"
          font-size="15"
          letter-spacing="2"
          fill="#536754">
      HTML / CSS / CONCEPT
    </text>

    <!-- Vertical divider -->

    <line x1="835" y1="89"
          x2="835" y2="239"
          stroke="#9BAE99"
          stroke-width="1"/>

    <!-- Construction geometry -->

    <g fill="none"
       stroke="#839C78"
       stroke-width="1"
       opacity="0.65">

      <circle cx="1000" cy="163" r="92"/>
      <circle cx="1000" cy="163" r="62"/>

      <path d="M870 163 H1130"/>
      <path d="M1000 79 V247"/>
      <path d="M907 231 L1093 95"/>

    </g>

    <!-- Resource network -->

    <g fill="none"
       stroke="url(#accent)"
       stroke-width="2.4"
       stroke-linecap="round"
       stroke-linejoin="round">

      <path d="M929 119 L1060 127"/>
      <path d="M929 119 L993 209"/>
      <path d="M1060 127 L993 209"/>

    </g>

    <!-- Outer node rings -->

    <g fill="#F0EEE7"
       stroke="#547C30"
       stroke-width="1.5">

      <circle cx="929" cy="119" r="11"/>
      <circle cx="1060" cy="127" r="11"/>
      <circle cx="993" cy="209" r="11"/>

    </g>

    <!-- Node centers -->

    <g fill="#547C30">

      <circle cx="929" cy="119" r="4"/>
      <circle cx="1060" cy="127" r="4"/>
      <circle cx="993" cy="209" r="4"/>

    </g>

    <!-- Resource labels -->

    <g font-family="monospace"
       font-size="11"
       letter-spacing="1.4"
       fill="#536754">

      <text x="929"
            y="96"
            text-anchor="middle">
        TIME
      </text>

      <text x="1060"
            y="104"
            text-anchor="middle">
        SLEEP
      </text>

      <text x="993"
            y="235"
            text-anchor="middle">
        ENERGY
      </text>

    </g>

    <!-- Central connection -->

    <circle cx="995" cy="151"
            r="4"
            fill="#547C30"
            opacity="0.85"/>

    <!-- Navigation arrow -->

    <path d="M1122 212
             H1145
             M1135 202
             L1145 212
             L1135 222"
          fill="none"
          stroke="#547C30"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Bottom accent -->

    <rect x="0" y="266"
          width="1200" height="4"
          fill="#8FC34A"
          opacity="0.9"/>

  </g>
</svg>